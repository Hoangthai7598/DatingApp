name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build-pages:
    name: Build for GitHub Pages
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check Supabase is configured
        # Without these the live page could not deliver bookings or feedback, so don't deploy.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          [ -n "$SUPABASE_URL" ] || { echo "::error::Repository variable SUPABASE_URL is not set (Settings → Secrets and variables → Actions → Variables)"; missing=1; }
          [ -n "$SUPABASE_PUBLISHABLE_KEY" ] || { echo "::error::Repository variable SUPABASE_PUBLISHABLE_KEY is not set"; missing=1; }
          case "$SUPABASE_PUBLISHABLE_KEY" in sb_secret_*) echo "::error::SUPABASE_PUBLISHABLE_KEY is a SECRET key. Use the publishable key (sb_publishable_...) and rotate the secret one."; missing=1;; esac
          exit $missing
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          # /<repo-name> for a project site, empty for <user>.github.io or a custom domain
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Settings → Secrets and variables → Actions → Variables (public by design)
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  # Deploy runs in its own job: deploy-pages in the same job as the upload can
  # query the artifact before GitHub lists it and fail with "No artifacts named github-pages".
  deploy:
    name: Deploy to GitHub Pages
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
